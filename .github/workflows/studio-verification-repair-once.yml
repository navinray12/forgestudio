name: Repair verified Site Studio integration issues once
on:
  push:
    branches: [webflow]
    paths: [.github/workflows/studio-verification-repair-once.yml]
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: github.ref == 'refs/heads/webflow'
    steps:
      - uses: actions/checkout@v4
      - name: Apply exact reviewed corrections
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          expected = {
            'backend/src/modules/studio-next/workspaces.ts': '4216fa7012b532ebb19feaf039ac9a5ebbfb8563',
            'backend/src/modules/studio-next/domains.ts': '065e9a5030cea3d19307ba34c917e09efe9b679c',
            'backend/tests/studio-next/fixture.ts': '50ccf1a19f074da450e24c8737e7a86eeb3f563a',
            'backend/src/modules/studio-next/design.ts': '368ce0db5daa7e3e6640981d7e46dc0f79f5a34f',
            'backend/tests/studio-next/platform.test.ts': '38790b8b72ccaf814853838fb21e8879fc3b9fc6',
            'frontend/src/features/studio-next/CmsPanel.tsx': '3f26e6f99bd6eeb509841d1e246b8c770a2212d4'
          }
          for name, sha in expected.items():
              data = Path(name).read_bytes()
              if hashlib.sha1(b'blob ' + str(len(data)).encode() + b'\0' + data).hexdigest() != sha:
                  raise SystemExit('Refusing to modify changed source: ' + name)
          def replace(name, old, new):
              p = Path(name)
              text = p.read_text()
              if text.count(old) != 1:
                  raise SystemExit('Expected one exact source match: ' + name + ': ' + old[:80])
              p.write_text(text.replace(old, new))
          replace('backend/src/modules/studio-next/workspaces.ts',
              "state=$2,expires_at=CASE WHEN $2='PENDING'",
              "state=$2::varchar,expires_at=CASE WHEN $2::varchar='PENDING'")
          replace('backend/src/modules/studio-next/domains.ts',
              "state=$3,verified_at=CASE WHEN $3='VERIFIED'",
              "state=$3::varchar,verified_at=CASE WHEN $3::varchar='VERIFIED'")
          replace('backend/src/modules/studio-next/workspaces.ts',
              '  const transport=nodemailer.createTransport(process.env.STUDIO_SMTP_URL,{connectionTimeout:5000,socketTimeout:8000});',
              '''  const smtpUrl=new URL(process.env.STUDIO_SMTP_URL);
            if(!['smtp:','smtps:'].includes(smtpUrl.protocol))throw new StudioError('Invalid mail transport configuration',503,'MAIL_NOT_CONFIGURED');
            for(const [key,value] of Object.entries({connectionTimeout:'5000',greetingTimeout:'5000',socketTimeout:'8000',dnsTimeout:'5000',disableFileAccess:'true',disableUrlAccess:'true'}))smtpUrl.searchParams.set(key,value);
            if(process.env.NODE_ENV==='production')smtpUrl.searchParams.set('requireTLS','true');
            const transport=nodemailer.createTransport(smtpUrl.toString());''')
          migration = Path('backend/prisma/migrations/20260928210000_studio_constraint_order/migration.sql')
          if migration.exists(): raise SystemExit('Refusing to overwrite a migration')
          migration.parent.mkdir(parents=True)
          migration.write_text('''-- Retain foreign-key integrity while permitting complete parent-site/user cascades.
          -- Direct deletion of a referenced locale or product still fails at COMMIT.
          ALTER TABLE studio.content_items ALTER CONSTRAINT content_items_site_id_locale_fkey DEFERRABLE INITIALLY DEFERRED;
          ALTER TABLE studio.page_translations ALTER CONSTRAINT page_translations_site_id_locale_fkey DEFERRABLE INITIALLY DEFERRED;
          ALTER TABLE studio.checkout_orders ALTER CONSTRAINT checkout_orders_product_id_site_id_fkey DEFERRABLE INITIALLY DEFERRED;
          ''')
          replace('backend/tests/studio-next/fixture.ts',
              '\n}\nexport type TestActor=',
              "\n  await pool.query(await readFile(new URL('../../prisma/migrations/20260928210000_studio_constraint_order/migration.sql',import.meta.url),'utf8'));\n}\nexport type TestActor=")
          replace('backend/src/modules/studio-next/design.ts',
              'for(const [id,node] of nodes(current))if(digest(findById(incoming,id)||null)!==digest(node))',
              'for(const id of nodes(current).keys())if(digest(findAllById(incoming,id))!==digest(findAllById(current,id)))')
          p=Path('backend/src/modules/studio-next/design.ts')
          text=p.read_text()
          start=text.index('function findById(')
          end=text.index('export class Design',start)
          text=text[:start]+'''function findAllById(value:any,id:string,result:any[]=[]):any[]{
            if(!value||typeof value!=='object')return result;
            if(value.id===id)result.push(value);
            for(const child of Object.values(value))findAllById(child,id,result);
            return result;
          }
          '''+text[end:]
          p.write_text(text)
          replace('backend/tests/studio-next/platform.test.ts',
              " test('snapshot restore makes a recovery point and leaves publishing state untouched'",
              """ test('duplicate IDs cannot conceal changes to protected components',async()=>{const a=await make(),b=await make(),s=await site(pool,a,{elements:[{id:'locked',isProtected:true,content:'Fixed'}]});await grant(pool,s,b,'DESIGNER');const d=await send('GET',`/sites/${s}/design`,b);d.website.editorData.elements.push({id:'locked',isProtected:true,content:'Changed duplicate'});await send('PUT',`/sites/${s}/design`,b,{baseHash:d.hash,editorData:d.website.editorData},403);});
           test('snapshot restore makes a recovery point and leaves publishing state untouched'""")
          replace('frontend/src/features/studio-next/CmsPanel.tsx',
              '<label>Type<select value={f.type}',
              '<label>Type<select aria-label="Type" value={f.type}')
          PY
          git diff --check
          git diff --stat
      - name: Commit application corrections and remove this workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add backend/src/modules/studio-next/workspaces.ts backend/src/modules/studio-next/domains.ts backend/src/modules/studio-next/design.ts backend/tests/studio-next/fixture.ts backend/tests/studio-next/platform.test.ts backend/prisma/migrations/20260928210000_studio_constraint_order/migration.sql frontend/src/features/studio-next/CmsPanel.tsx
          git rm .github/workflows/studio-verification-repair-once.yml
          git commit -m 'fix(studio): correct SQL typing, cascade integrity, mail options and protected-node checks; label CMS field types'
          git push origin HEAD:refs/heads/webflow
