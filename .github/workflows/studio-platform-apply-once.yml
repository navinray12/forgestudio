name: Apply reviewed Site Studio implementation once
on:
  push:
    branches: [webflow]
    paths: [.github/workflows/studio-platform-apply-once.yml]
permissions:
  contents: write
jobs:
  apply:
    if: github.ref == 'refs/heads/webflow'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Verify parent and materialize the reviewed source patch
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = d4c2cc97d4cf88571779f9654bd893bd8c155812
          mkdir -p "$RUNNER_TEMP/studio-reviewed"
          for sha in \
            724b70942e6392f875266ecbf3ceda3591cb5de3 \
            d6469f83845d3665387ad06d2ca7721067ebea0b \
            ba6ec68c2fd7ae6650b195a2890d2699bf7202ea \
            40497920e909a39749ce023fb354e2f89b0582e5 \
            b4ce346a5e8034635c333dc41297de33b745d934 \
            348c2054266067bdb3ce2d759dea0355669dbd30 \
            0e83da68c526baa25ddf8d888c0c15ae0e1ca7ad \
            35cec9fba797a149c37b3ceaeeb76ffacae3a57f \
            9d820be2fbee1d2ebeba50eb6561d16146b851bb
          do
            gh api "repos/navinray12/forgestudio/git/blobs/$sha" > "$RUNNER_TEMP/studio-reviewed/$sha.json"
          done
          node <<'JS'
          const fs = require('node:fs');
          const crypto = require('node:crypto');
          const zlib = require('node:zlib');
          const path = require('node:path');
          const directory = path.join(process.env.RUNNER_TEMP, 'studio-reviewed');
          const hashes = [
            '724b70942e6392f875266ecbf3ceda3591cb5de3',
            'd6469f83845d3665387ad06d2ca7721067ebea0b',
            'ba6ec68c2fd7ae6650b195a2890d2699bf7202ea',
            '40497920e909a39749ce023fb354e2f89b0582e5',
            'b4ce346a5e8034635c333dc41297de33b745d934',
            '348c2054266067bdb3ce2d759dea0355669dbd30',
            '0e83da68c526baa25ddf8d888c0c15ae0e1ca7ad',
            '35cec9fba797a149c37b3ceaeeb76ffacae3a57f',
            '9d820be2fbee1d2ebeba50eb6561d16146b851bb'
          ];
          const segments = hashes.map(sha => {
            const response = JSON.parse(fs.readFileSync(path.join(directory, `${sha}.json`), 'utf8'));
            if (response.encoding !== 'base64' || response.sha !== sha) throw new Error('Unexpected blob response');
            const bytes = Buffer.from(response.content.replace(/\s/g, ''), 'base64');
            const actual = crypto.createHash('sha1').update(`blob ${bytes.length}\0`).update(bytes).digest('hex');
            if (actual !== sha) throw new Error('Blob integrity failure');
            return bytes;
          });
          const compressed = Buffer.concat(segments);
          const digest = bytes => crypto.createHash('sha256').update(bytes).digest('hex');
          if (compressed.length !== 65908 || digest(compressed) !== '53c4a3e45c1766120a8c82b8b7e108ee4ee4d06d681f9b29e946e5f691d22848') throw new Error('Compressed patch integrity failure');
          const patch = zlib.brotliDecompressSync(compressed);
          if (patch.length !== 312351 || digest(patch) !== 'dd6264b7611d8d581799aef4a05297072da2772af730e189ce39994af3b2f502') throw new Error('Source patch integrity failure');
          fs.writeFileSync(path.join(directory, 'changes.patch'), patch);
          console.log('Verified reviewed patch:', patch.length, 'bytes');
          JS
          git apply --check --index "$RUNNER_TEMP/studio-reviewed/changes.patch"
          git apply --index "$RUNNER_TEMP/studio-reviewed/changes.patch"
          git diff --cached --check
          git diff --cached --stat
      - name: Commit the source and remove temporary workflows
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/studio-platform-apply-once.yml .github/workflows/studio-source-snapshot.yml
          git commit -m 'feat(studio): implement CMS, localization, workspace governance, secure collaboration, checkout and analytics workflows'
          git push origin HEAD:refs/heads/webflow
