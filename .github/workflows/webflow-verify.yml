name: Webflow branch verification
on:
  push:
    branches: [webflow]
    paths-ignore: ['docs/**']
  pull_request:
    branches: [backup-devnew]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: webflow-verify-${{ github.ref }}
  cancel-in-progress: true
jobs:
  studio-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: forgestudio_studio_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d forgestudio_studio_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npm run test:studio
      - run: npm run test:studio:postgres
        env:
          STUDIO_TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/forgestudio_studio_test
  frontend-build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: studio-frontend-dist
          path: frontend/dist/
          retention-days: 3
          if-no-files-found: error
  backend-build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npm run db:generate
        env:
          DATABASE_URL: postgresql://unused:unused@localhost:5432/not_a_live_database
      - run: npm run build
  studio-browser-smoke:
    needs: frontend-build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: studio-frontend-dist
          path: studio-built-dist
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install playwright==1.57.0
      - run: python -m playwright install --with-deps chromium
      - run: python tests/studio/browser_smoke.py studio-built-dist studio-browser-results
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: studio-browser-results
          path: studio-browser-results/
          retention-days: 7
          if-no-files-found: warn
  studio-platform-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: forgestudio_studio_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d forgestudio_studio_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npm run test:studio:next
        env:
          STUDIO_TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/forgestudio_studio_test
  studio-platform-browser:
    needs: frontend-build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: forgestudio_studio_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d forgestudio_studio_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: studio-frontend-dist
          path: studio-built-dist
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
        working-directory: backend
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install playwright==1.57.0
      - run: python -m playwright install --with-deps chromium
      - name: Exercise real session and database browser flows
        shell: bash
        env:
          STUDIO_TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/forgestudio_studio_test
          FRONTEND_URL: http://127.0.0.1:5188
        run: |
          mkdir -p studio-platform-results
          (cd backend && npx tsx tests/studio-next/browser-server.ts) > studio-platform-results/server.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          for n in $(seq 1 45); do
            test -f studio-test-session.json && break
            kill -0 "$SERVER_PID" 2>/dev/null || { cat studio-platform-results/server.log; exit 1; }
            sleep 1
          done
          test -f studio-test-session.json
          python tests/studio-next/browser_e2e.py studio-test-session.json studio-platform-results
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: studio-platform-results
          path: studio-platform-results/
          retention-days: 7
          if-no-files-found: warn
