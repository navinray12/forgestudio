name: Studio source snapshot
on:
  push:
    branches: [webflow]
    paths: [.github/workflows/studio-source-snapshot.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: git archive --format=zip --output=studio-source.zip HEAD
      - uses: actions/upload-artifact@v4
        with:
          name: studio-source
          path: studio-source.zip
          retention-days: 1
