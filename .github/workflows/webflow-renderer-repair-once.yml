name: Repair verified duplicate renderer declaration once
on:
  push:
    branches: [webflow]
    paths: [.github/workflows/webflow-renderer-repair-once.yml]
permissions:
  contents: write
jobs:
  repair:
    if: github.ref == 'refs/heads/webflow'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Remove only the verified duplicate state declaration
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          path = Path('frontend/src/pages/published/PublishedSite.tsx')
          original = path.read_bytes()
          actual = hashlib.sha1(b'blob ' + str(len(original)).encode() + b'\0' + original).hexdigest()
          if actual != '8bec6b94082cede942908e18302a9f5a88219ece':
              raise SystemExit('Source changed; refusing to modify an unreviewed renderer version')
          line = b'    const [sitePartsState, setSitePartsState] = useState<any>(null);\n'
          if original.count(line) != 2:
              raise SystemExit('Expected exactly two identical state declarations')
          start = original.rfind(line)
          path.write_bytes(original[:start] + original[start + len(line):])
          PY
          git diff --check
          git diff -- frontend/src/pages/published/PublishedSite.tsx
      - name: Commit the one-line fix and remove this one-time workflow
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add frontend/src/pages/published/PublishedSite.tsx
          git rm .github/workflows/webflow-renderer-repair-once.yml
          git commit -m 'fix(published): remove duplicate site-parts state declaration'
          git push origin HEAD:refs/heads/webflow
